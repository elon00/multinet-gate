name: Offline netting regression
on:
  push:
    branches: [main, audit/offline-netting-balance-gate-20261028]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python compilation
        run: python -m compileall -q netting_gate.py tests
      - name: Offline conservation regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rust format and compilation
        run: |
          cargo fmt --all -- --check
          cargo check --offline
